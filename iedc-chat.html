<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IEDC Connect | Spatial Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        glass: {
                            base: 'rgba(30, 30, 30, 0.45)',     // Main container background
                            panel: 'rgba(0, 0, 0, 0.2)',        // Inner panel background
                            border: 'rgba(255, 255, 255, 0.08)',// Subtle borders
                            hover: 'rgba(255, 255, 255, 0.05)', // Hover state
                            active: 'rgba(255, 255, 255, 0.1)', // Active state
                            accent: '#3b82f6',                  // Blue accent (like the badge)
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            /* Abstract interior background to give the spatial computing vibe */
            background-image: url('https://images.unsplash.com/photo-1600607686527-6fb886090705?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* Heavy background blur overlay */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 15, 15, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: -1;
        }

        /* App Container Styling matching the image */
        .app-container {
            background: var(--color-glass-base);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Floating Nav Bar */
        .floating-nav {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Input styling */
        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
            outline: none;
        }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.3); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* Hide scrollbar for stories */
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        /* Chat Bubbles */
        .bubble-in {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            border-top-left-radius: 4px;
        }
        .bubble-out {
            background: rgba(59, 130, 246, 0.2); /* Soft blue translucent */
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 18px;
            border-top-right-radius: 4px;
        }

        /* Mobile specific layout transitions */
        @media (max-width: 1024px) {
            .mobile-view-chat #col-list { display: none; }
            .mobile-view-chat #col-chat { display: flex; }
            
            #col-chat { display: none; }
            #col-list { display: flex; width: 100%; }
        }

        /* Spinner */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 2px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // YOUR FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyAIn9hB7Hx4Nwwk5Ar9bE3tFuo40VkBcc8",
            authDomain: "metsiedc-3010e.firebaseapp.com",
            databaseURL: "https://metsiedc-3010e-default-rtdb.firebaseio.com",
            projectId: "metsiedc-3010e",
            storageBucket: "metsiedc-3010e.firebasestorage.app",
            messagingSenderId: "954403413150",
            appId: "1:954403413150:web:2523a3377f15a3d6002f8f",
            measurementId: "G-6E7EK0D7JG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Variables
        let currentUser = null;
        let currentUserName = "Student";
        let currentUserAvatar = "https://ui-avatars.com/api/?name=Student&background=3b82f6&color=fff";
        const currentChannelId = "general";

        // DOM Nodes
        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const loadingMessages = document.getElementById('loadingMessages');
        const mainApp = document.getElementById('main-app');

        // Mobile View Toggling
        window.openMobileChat = function() {
            if (window.innerWidth <= 1024) {
                mainApp.classList.add('mobile-view-chat');
            }
        }
        document.getElementById('backToChatsBtn').addEventListener('click', () => {
            mainApp.classList.remove('mobile-view-chat');
        });
        
        // Auto open on load for demo
        setTimeout(() => { if(window.innerWidth <= 1024) openMobileChat(); }, 300);

        // 1. Auth Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                try {
                    const docSnap = await getDoc(doc(db, "users", user.uid, "profile", "userProfile"));
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        currentUserName = data.name || user.displayName || user.email.split('@')[0];
                        if (data.profileImage) currentUserAvatar = data.profileImage;
                    } else if (user.displayName) {
                        currentUserName = user.displayName;
                    } else if (user.email) {
                        currentUserName = user.email.split('@')[0];
                    }
                } catch(e) {
                    console.error("Profile fetch error:", e);
                }

                document.getElementById('myName').textContent = currentUserName.split(' ')[0];
                document.getElementById('myAvatar').src = currentUserAvatar;
                const mobAv = document.getElementById('myAvatarMobile');
                if(mobAv) mobAv.src = currentUserAvatar;

                // Load Chat
                listenForMessages();
            } else {
                window.location.href = 'login.html';
            }
        });

        // 2. Real-Time Chat Listener
        function listenForMessages() {
            const messagesRef = collection(db, "group_chats", currentChannelId, "messages");
            const q = query(messagesRef, orderBy("timestamp", "asc"));

            onSnapshot(q, (snapshot) => {
                if (loadingMessages) loadingMessages.style.display = 'none';
                
                const messagesList = [];
                snapshot.forEach((doc) => {
                    messagesList.push({ id: doc.id, ...doc.data() });
                });

                renderMessages(messagesList);
            }, (error) => {
                console.error("Error fetching messages:", error);
                loadingMessages.innerHTML = `<p class="text-red-400 text-xs bg-red-500/10 p-3 rounded-xl border border-red-500/20">Error connecting to chat server.</p>`;
            });
        }

        // 3. Render Messages to DOM
        function renderMessages(messages) {
            const existingMessages = document.querySelectorAll('.message-wrapper');
            existingMessages.forEach(el => el.remove());

            let lastSenderId = null;

            messages.forEach((msg, index) => {
                const isMe = msg.senderId === currentUser.uid;
                const isSameAsLast = lastSenderId === msg.senderId;
                lastSenderId = msg.senderId;
                
                let timeString = '';
                if (msg.timestamp) {
                    const date = msg.timestamp.toDate ? msg.timestamp.toDate() : new Date(msg.timestamp);
                    timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }

                const alignClass = isMe ? "justify-end" : "justify-start";
                const bubbleColor = isMe ? "bubble-out" : "bubble-in";
                const textColor = isMe ? "text-blue-50" : "text-white/90";
                
                const avatarHtml = (!isMe && !isSameAsLast) ? `
                    <div class="w-8 h-8 rounded-full overflow-hidden shrink-0 mt-auto border border-white/10 shadow-sm">
                        <img src="${msg.senderAvatar || 'https://ui-avatars.com/api/?name='+msg.senderName+'&background=3b82f6&color=fff'}" class="w-full h-full object-cover">
                    </div>
                ` : (!isMe ? `<div class="w-8 shrink-0"></div>` : ''); // Spacer for alignment

                const nameHtml = (!isMe && !isSameAsLast) ? `
                    <div class="text-[11px] font-bold text-white/60 mb-1 ml-1">${msg.senderName}</div>
                ` : '';

                const marginClass = isSameAsLast ? "mt-1" : "mt-4";

                const msgElement = document.createElement('div');
                msgElement.className = `flex w-full ${alignClass} gap-2 ${marginClass} message-wrapper px-2 md:px-6`;
                
                msgElement.innerHTML = `
                    ${avatarHtml}
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[85%] md:max-w-[70%]">
                        ${nameHtml}
                        <div class="${bubbleColor} px-4 py-2.5 shadow-md flex flex-col min-w-[80px]">
                            <span class="text-[14px] leading-relaxed ${textColor} break-words">${msg.text}</span>
                            <span class="text-[9px] font-medium text-white/40 self-end mt-1">${timeString}</span>
                        </div>
                    </div>
                `;

                messagesContainer.appendChild(msgElement);
            });
            
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // 4. Send Message
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            messageInput.value = '';
            sendBtn.disabled = true;

            try {
                const messagesRef = collection(db, "group_chats", currentChannelId, "messages");
                await addDoc(messagesRef, {
                    text: text,
                    senderId: currentUser.uid,
                    senderName: currentUserName,
                    senderAvatar: currentUserAvatar,
                    timestamp: serverTimestamp()
                });
                scrollToBottom();
            } catch(error) {
                console.error("Error sending message: ", error);
                alert("Message failed to send. Please try again.");
            } finally {
                sendBtn.disabled = false;
                messageInput.focus();
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });

    </script>
</body>
</html>
