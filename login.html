<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IEDC Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            /* Abstract interior background matching IEDC Connect */
            background-image: url('https://images.unsplash.com/photo-1600607686527-6fb886090705?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* Heavy background blur overlay */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            z-index: -1;
        }

        /* App Container Styling matching the image */
        .spatial-card {
            background: rgba(30, 30, 30, 0.45);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            border-radius: 2rem;
        }

        /* Input styling */
        .spatial-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            transition: all 0.3s ease;
        }
        .spatial-input:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(59, 130, 246, 0.5); /* Blue tint for Connect */
            outline: none;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }
        .spatial-input:disabled { opacity: 0.5; cursor: not-allowed; }
        .spatial-input::placeholder { color: rgba(255, 255, 255, 0.4); font-weight: 300; }

        /* Auth Tabs styling (Segmented Control) */
        .tab-btn {
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .tab-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.05);
        }
        .tab-btn.active {
            color: #ffffff;
            background: rgba(59, 130, 246, 0.2); /* Blue accent for Connect */
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Signup Method Tabs */
        .method-btn {
            padding-bottom: 0.5rem;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .method-btn.active {
            color: #3b82f6; /* Blue Accent */
            border-bottom-color: #3b82f6;
        }

        /* Loading Spinner */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 2px solid #ffffff;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="relative min-h-screen flex flex-col selection:bg-blue-500/30 selection:text-white">

    <div class="bg-overlay"></div>

    <!-- Header (Minimalist) -->
    <header class="w-full py-6 px-6 md:px-10 absolute top-0 z-20 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-500 to-indigo-500 border border-white/10 flex items-center justify-center text-white shadow-lg backdrop-blur-md">
                <i class="fas fa-globe text-lg"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-white group-hover:opacity-80 transition-opacity">
                IEDC Connect
            </span>
        </a>
        <a href="login.html" class="text-[10px] font-bold uppercase tracking-wider text-white/50 hover:text-white transition-colors bg-black/40 border border-white/10 px-5 py-2.5 rounded-full backdrop-blur-md hover:bg-black/60 flex items-center gap-2">
            <i class="fas fa-arrow-left"></i> Main Portal
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 py-24 relative z-10 w-full">
        <div class="spatial-card p-8 md:p-10 w-full max-w-md relative flex flex-col mt-8">
            
            <div class="text-center mb-8">
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-2 tracking-tight">Web Chat Access</h2>
                <p class="text-white/50 text-xs font-medium tracking-wide">Join the global community</p>
            </div>

            <!-- Tab Switcher -->
            <div class="flex p-1.5 bg-black/30 rounded-2xl border border-white/5 mb-8 inset-shadow-sm">
                <button id="loginTabBtn" class="tab-btn active w-1/2 py-2.5 rounded-xl text-[11px] uppercase tracking-wider font-bold" onclick="switchAuthMode('login')">Login</button>
                <button id="signupTabBtn" class="tab-btn w-1/2 py-2.5 rounded-xl text-[11px] uppercase tracking-wider font-bold" onclick="switchAuthMode('signup')">Sign Up</button>
            </div>

            <!-- Status Message Box -->
            <div id="statusMessage" class="hidden mb-6 p-4 rounded-xl text-xs text-center border font-semibold tracking-wide backdrop-blur-md"></div>
            
            <!-- Recaptcha Container (For Phone Auth) -->
            <div id="recaptcha-container" class="mb-4"></div>

            <!-- LOGIN FORM -->
            <div id="loginSection">
                <div class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-bold text-white/60 mb-2 uppercase tracking-wider">Email Address</label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white/40 w-4 h-4"></i>
                            <input type="email" id="loginEmail" placeholder="student@example.com" class="spatial-input w-full rounded-xl py-3.5 pl-11 pr-4 text-sm font-medium">
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-[10px] font-bold text-white/60 uppercase tracking-wider">Password</label>
                            <a href="#" id="forgotPasswordLink" class="text-[10px] font-bold text-blue-400 hover:text-blue-300 transition-colors uppercase tracking-wider">Forgot?</a>
                        </div>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white/40 w-4 h-4"></i>
                            <input type="password" id="loginPassword" placeholder="••••••••" class="spatial-input w-full rounded-xl py-3.5 pl-11 pr-12 text-sm font-medium">
                            <button type="button" class="toggle-password absolute right-4 top-1/2 transform -translate-y-1/2 text-white/40 hover:text-white transition-colors">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button id="loginBtn" class="w-full bg-blue-500 hover:bg-blue-600 border border-blue-400/50 text-white font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition-all mt-6 shadow-[0_0_15px_rgba(59,130,246,0.3)] flex justify-center items-center gap-2">
                        <span id="loginBtnText">Enter Chat</span>
                        <div id="loginSpinner" class="spinner hidden"></div>
                    </button>
                </div>
            </div>

            <!-- SIGNUP FORM (OTP Based) -->
            <div id="signupSection" class="hidden">
                <!-- Method Toggle -->
                <div class="flex mb-6 border-b border-white/10">
                    <button id="methodEmail" class="method-btn active" onclick="switchSignupMethod('email')">Email Verification</button>
                    <button id="methodPhone" class="method-btn" onclick="switchSignupMethod('phone')">Phone Verification</button>
                </div>

                <!-- Email OTP Signup -->
                <div id="emailSignupFlow">
                    <div id="emailStep1">
                        <label class="block text-[10px] font-bold text-white/60 mb-2 uppercase tracking-wider">Email Address</label>
                        <div class="flex gap-3">
                            <input type="email" id="signupEmailInput" placeholder="student@example.com" class="spatial-input w-full rounded-xl py-3 px-4 text-sm font-medium">
                            <button id="sendEmailOtpBtn" class="bg-blue-500/20 hover:bg-blue-500/40 border border-blue-500/30 text-blue-400 text-[10px] uppercase tracking-wider font-bold px-5 rounded-xl transition whitespace-nowrap shadow-sm">
                                Send
                            </button>
                        </div>
                    </div>

                    <div id="emailStep2" class="hidden mt-6 space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-white/60 mb-2 uppercase tracking-wider">Verification Code</label>
                            <input type="text" id="emailOtpInput" placeholder="000000" class="spatial-input w-full rounded-xl py-3.5 px-4 text-center tracking-[0.5em] font-mono text-lg mb-4">
                            <button id="verifyEmailOtpBtn" class="w-full bg-white/10 hover:bg-white/20 border border-white/20 text-white text-xs uppercase tracking-wider font-bold py-3.5 rounded-xl transition shadow-lg">Verify Code</button>
                        </div>
                    </div>

                    <div id="emailStep3" class="hidden mt-6 space-y-5">
                         <div class="p-3 bg-green-500/20 border border-green-500/30 rounded-xl text-center text-xs font-bold text-green-300 flex items-center justify-center gap-2 backdrop-blur-md">
                             <i data-lucide="check-circle" class="w-4 h-4"></i> Email Verified
                         </div>
                         <div>
                            <label class="block text-[10px] font-bold text-white/60 mb-2 uppercase tracking-wider">Set Password</label>
                             <div class="relative">
                                <i data-lucide="lock" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white/40 w-4 h-4"></i>
                                <input type="password" id="newPassword" placeholder="Min 8 characters" class="spatial-input w-full rounded-xl py-3.5 pl-11 pr-12 text-sm font-medium">
                                <button type="button" class="toggle-password absolute right-4 top-1/2 transform -translate-y-1/2 text-white/40 hover:text-white transition-colors">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button id="createEmailAccountBtn" class="w-full bg-blue-500 hover:bg-blue-600 border border-blue-400/50 text-white font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg mt-2">
                            Create Account
                        </button>
                    </div>
                </div>

                <!-- Phone OTP Signup -->
                <div id="phoneSignupFlow" class="hidden">
                    <div id="phoneStep1">
                        <label class="block text-[10px] font-bold text-white/60 mb-2 uppercase tracking-wider">Mobile Number</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white/50 font-medium">+91</span>
                            <input type="tel" id="phoneNumberInput" placeholder="9876543210" class="spatial-input w-full rounded-xl py-3.5 pl-12 pr-4 text-sm font-medium tracking-wide" maxlength="10">
                        </div>
                        <button id="sendPhoneOtpBtn" class="w-full mt-6 bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg">
                            Send SMS Code
                        </button>
                    </div>

                    <div id="phoneStep2" class="hidden mt-6">
                        <label class="block text-[10px] font-bold text-white/60 mb-2 uppercase tracking-wider">Enter SMS Code</label>
                        <input type="text" id="phoneOtpInput" placeholder="000000" class="spatial-input w-full rounded-xl py-3.5 px-4 text-center text-lg font-mono tracking-[0.5em] mb-4" maxlength="6">
                        <button id="verifyPhoneOtpBtn" class="w-full bg-blue-500 hover:bg-blue-600 border border-blue-400/50 text-white font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg">
                            Verify & Create Account
                        </button>
                    </div>
                </div>
            </div>

            <!-- Divider -->
            <div class="relative flex py-8 items-center opacity-60">
                <div class="flex-grow border-t border-white/10"></div>
                <span class="flex-shrink-0 mx-4 text-white/60 text-[10px] uppercase tracking-widest font-bold">Or continue with</span>
                <div class="flex-grow border-t border-white/10"></div>
            </div>

            <!-- Google Button -->
            <button id="googleBtn" class="w-full flex items-center justify-center gap-3 py-3.5 rounded-xl border border-white/10 bg-black/30 hover:bg-black/50 transition-all text-xs font-bold text-white shadow-sm backdrop-blur-md">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                Sign in with Google
            </button>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            sendPasswordResetEmail, 
            onAuthStateChanged,
            GoogleAuthProvider,
            signInWithPopup,
            RecaptchaVerifier, 
            signInWithPhoneNumber
        } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAIn9hB7Hx4Nwwk5Ar9bE3tFuo40VkBcc8",
            authDomain: "metsiedc-3010e.firebaseapp.com",
            databaseURL: "https://metsiedc-3010e-default-rtdb.firebaseio.com",
            projectId: "metsiedc-3010e",
            storageBucket: "metsiedc-3010e.firebasestorage.app",
            messagingSenderId: "954403413150",
            appId: "1:954403413150:web:2523a3377f15a3d6002f8f",
            measurementId: "G-6E7EK0D7JG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // EMAILJS CONFIG
        const EMAILJS_SERVICE_ID = "service_bx5uu8w"; 
        const EMAILJS_TEMPLATE_ID = "template_9r7x5h7";
        const EMAILJS_PUBLIC_KEY = "XlJSQA_pulXBpPApt";
        emailjs.init(EMAILJS_PUBLIC_KEY);

        lucide.createIcons();

        // GLOBALS
        let generatedEmailOtp = null;
        let verifiedEmailAddress = null;
        window.confirmationResult = null; 

        // --- UTILS ---
        function showMessage(msg, type = 'error') {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            if (type === 'error') {
                el.className = "mb-6 p-4 rounded-xl text-[10px] uppercase tracking-widest text-center border font-bold bg-red-500/20 text-red-300 border-red-500/30 backdrop-blur-md";
            } else {
                el.className = "mb-6 p-4 rounded-xl text-[10px] uppercase tracking-widest text-center border font-bold bg-green-500/20 text-green-300 border-green-500/30 backdrop-blur-md";
            }
            el.classList.remove('hidden');
        }

        // --- NAVIGATION ---
        window.switchAuthMode = (mode) => {
            document.getElementById('statusMessage').classList.add('hidden');
            if (mode === 'login') {
                document.getElementById('loginTabBtn').classList.add('active');
                document.getElementById('signupTabBtn').classList.remove('active');
                document.getElementById('loginTabBtn').classList.remove('border-transparent');
                document.getElementById('signupTabBtn').classList.add('border-transparent');
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('signupSection').classList.add('hidden');
            } else {
                document.getElementById('signupTabBtn').classList.add('active');
                document.getElementById('loginTabBtn').classList.remove('active');
                document.getElementById('signupTabBtn').classList.remove('border-transparent');
                document.getElementById('loginTabBtn').classList.add('border-transparent');
                document.getElementById('signupSection').classList.remove('hidden');
                document.getElementById('loginSection').classList.add('hidden');
            }
        };

        window.switchSignupMethod = (method) => {
            document.getElementById('statusMessage').classList.add('hidden');
            if (method === 'email') {
                document.getElementById('emailSignupFlow').classList.remove('hidden');
                document.getElementById('phoneSignupFlow').classList.add('hidden');
                document.getElementById('methodEmail').classList.add('active');
                document.getElementById('methodPhone').classList.remove('active');
            } else {
                document.getElementById('phoneSignupFlow').classList.remove('hidden');
                document.getElementById('emailSignupFlow').classList.add('hidden');
                document.getElementById('methodPhone').classList.add('active');
                document.getElementById('methodEmail').classList.remove('active');
                if(!window.recaptchaVerifier) setupRecaptcha();
            }
        };

        // --- LOGIN LOGIC ---
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            if(!email || !pass) return showMessage("Please enter email and password");
            
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('loginSpinner');
            const text = document.getElementById('loginBtnText');
            btn.disabled = true; spinner.classList.remove('hidden'); text.textContent = "Authenticating...";

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                // REDIRECT TO CHAT APP
                window.location.href = 'iedc-chat.html';
            } catch(e) {
                showMessage("Login Failed: Incorrect credentials.");
                btn.disabled = false; spinner.classList.add('hidden'); text.textContent = "Enter Chat";
            }
        });

        // --- FORGOT PASSWORD LOGIC ---
        document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            if (!email) {
                return showMessage("Please enter your email address first to reset your password.", "error");
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showMessage("Password reset email sent! Check your inbox.", "success");
            } catch (error) {
                showMessage("Error: " + error.message, "error");
            }
        });

        // --- EMAIL OTP SIGNUP LOGIC ---
        document.getElementById('sendEmailOtpBtn').addEventListener('click', async () => {
            const email = document.getElementById('signupEmailInput').value;
            if(!email.includes('@')) return showMessage("Invalid Email Address");
            
            const btn = document.getElementById('sendEmailOtpBtn');
            btn.disabled = true; btn.textContent = "Sending...";

            generatedEmailOtp = Math.floor(100000 + Math.random() * 900000).toString();
            
            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    email: email,
                    passcode: generatedEmailOtp
                });
                showMessage("Verification Code Sent!", "success");
                document.getElementById('emailStep2').classList.remove('hidden');
            } catch(e) {
                console.error(e);
                showMessage("Failed to send code. Try again later.");
            } finally {
                btn.disabled = false; btn.textContent = "Resend";
            }
        });

        document.getElementById('verifyEmailOtpBtn').addEventListener('click', () => {
            const input = document.getElementById('emailOtpInput').value;
            if(input === generatedEmailOtp) {
                showMessage("Email Verified Successfully!", "success");
                verifiedEmailAddress = document.getElementById('signupEmailInput').value;
                document.getElementById('emailStep1').classList.add('hidden');
                document.getElementById('emailStep2').classList.add('hidden');
                document.getElementById('emailStep3').classList.remove('hidden');
            } else {
                showMessage("Invalid Verification Code.");
            }
        });

        document.getElementById('createEmailAccountBtn').addEventListener('click', async () => {
            const pass = document.getElementById('newPassword').value;
            if(pass.length < 8) return showMessage("Password must be at least 8 characters.");
            
            try {
                const cred = await createUserWithEmailAndPassword(auth, verifiedEmailAddress, pass);
                await setDoc(doc(db, "users", cred.user.uid), {
                    email: verifiedEmailAddress,
                    role: 'student',
                    authProvider: 'email',
                    createdAt: serverTimestamp()
                });
                // REDIRECT TO CHAT APP
                window.location.href = 'iedc-chat.html';
            } catch(e) { showMessage(e.message); }
        });

        // --- PHONE OTP SIGNUP LOGIC ---
        function setupRecaptcha() {
            window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                'size': 'invisible'
            });
        }

        document.getElementById('sendPhoneOtpBtn').addEventListener('click', async () => {
            const phone = document.getElementById('phoneNumberInput').value;
            if(phone.length < 10) return showMessage("Invalid Phone Number");
            
            const btn = document.getElementById('sendPhoneOtpBtn');
            btn.disabled = true; btn.textContent = "Sending...";
            
            try {
                const appVerifier = window.recaptchaVerifier;
                const phoneNumber = "+91" + phone;
                window.confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, appVerifier);
                document.getElementById('phoneStep1').classList.add('hidden');
                document.getElementById('phoneStep2').classList.remove('hidden');
                showMessage("Code Sent via SMS", "success");
            } catch (error) {
                showMessage("Network error or invalid request.");
                btn.disabled = false; btn.textContent = "Send SMS Code";
                if(window.recaptchaVerifier) window.recaptchaVerifier.clear();
            }
        });

        document.getElementById('verifyPhoneOtpBtn').addEventListener('click', async () => {
            const code = document.getElementById('phoneOtpInput').value;
            try {
                const result = await window.confirmationResult.confirm(code);
                const user = result.user;
                
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (!userDoc.exists()) {
                    await setDoc(doc(db, "users", user.uid), {
                        phone: user.phoneNumber,
                        role: 'student',
                        authProvider: 'phone',
                        createdAt: serverTimestamp()
                    });
                }
                // REDIRECT TO CHAT APP
                window.location.href = 'iedc-chat.html';
            } catch (error) {
                showMessage("Invalid SMS Code");
            }
        });

        // --- GOOGLE AUTH ---
        document.getElementById('googleBtn').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, new GoogleAuthProvider());
                const user = result.user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (!userDoc.exists()) {
                    await setDoc(doc(db, "users", user.uid), { 
                        email: user.email, 
                        name: user.displayName, 
                        role: 'student', 
                        authProvider: 'google', 
                        createdAt: serverTimestamp() 
                    });
                }
                // REDIRECT TO CHAT APP
                window.location.href = 'iedc-chat.html';
            } catch(e) { showMessage(e.message); }
        });

        // --- MISC UI/UX ---
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                const icon = this.querySelector('i');
                input.type = input.type === 'password' ? 'text' : 'password';
                icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash');
            });
        });

        // Auth State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // REDIRECT TO CHAT APP
                window.location.href = 'iedc-chat.html';
            }
        });

    </script>
</body>
</html>
